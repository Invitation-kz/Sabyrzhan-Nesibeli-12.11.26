<!doctype html>
<html lang="kk">
    <head>
        <!-- Шрифт Lora (кириллица + казахские буквы) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap&subset=cyrillic,cyrillic-ext"
            rel="stylesheet"
        />

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:title" content="Сабыржан & Несібелі үйлену тойына шақыру!" />
        <meta property="og:description" content="12.11.2026" />
        <meta
            property="og:image"
            content="https://raw.githubusercontent.com/Invitation-kz/Sabyrzhan-Nesibeli-12.11.26/main/og.jpg"
        />

        <title>Сабыржан & Несібелі үйлену тойына шақыру!</title>

        <style>
            :root {
                --font: "Lora", Georgia, "Times New Roman", serif;
                --accent: #624231;
                --accent-dark: #4a3125;
                --accent-light: #7a5440;
                --paper: url("background.jpg");
            }

            /* Единый шрифт для всей страницы */
            html,
            body,
            button,
            input,
            textarea,
            label,
            span,
            h2 {
                font-family: var(--font);
            }

            /* Статичный фон: стоит на месте, фото (png) прокручиваются поверх него */
            html {
                background-color: #f1eeea;
            }
            body {
                background: transparent;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background-color: #f1eeea;
                background-image: var(--paper);
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                pointer-events: none;
            }

            img.pic {
                display: block;
                width: 100%;
                height: auto;
            }

            .element-animation {
                opacity: 0;
                transform: translateY(20px);
            }
            .element-animation.element-show {
                opacity: 1;
                transform: none;
                transition-duration: 1.4s;
            }

            /* ===== Фото с таймером по центру ===== */
            .timer-photo {
                position: relative;
                container-type: inline-size;
            }
            .countdown-container {
                position: absolute;
                top: 57%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                align-items: flex-start;
                justify-content: center;
                width: 100%;
                margin: 0;
                background: transparent;
                color: #fff;
                text-align: center;
                text-shadow:
                    0 1px 6px rgba(0, 0, 0, 0.75),
                    0 0 2px rgba(0, 0, 0, 0.6);
            }
            .countdown-item {
                min-width: 15cqw;
                margin: 0 0.5cqw;
            }
            .countdown-item .num {
                display: block;
                font-size: 8.5cqw;
                font-weight: 500;
                line-height: 1.1;
                font-variant-numeric: tabular-nums;
            }
            .countdown-item .label {
                display: block;
                margin-top: 0.6cqw;
                font-size: 3.4cqw;
                letter-spacing: 0.04em;
            }
            .countdown-sep {
                font-size: 8.5cqw;
                font-weight: 500;
                line-height: 1.1;
            }

            /* ===== Форма ответа ===== */
            .form-section {
                padding: 10px 0 40px;
            }

            #form {
                display: block;
                width: 100%;
                max-width: 380px;
                margin: 0 auto;
                padding: 0 24px;
                box-sizing: border-box;
                text-align: left;
            }

            .form-inner {
                position: relative;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .radio-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
                width: 100%;
                margin: 0 0 6px;
            }

            .radio-option {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 13px 18px;
                background-color: #f1eeea;
                background-image: var(--paper);
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                border: 1px solid rgba(98, 66, 49, 0.3);
                border-radius: 14px;
                cursor: pointer;
                transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease;
            }
            .radio-option:hover {
                border-color: rgba(98, 66, 49, 0.6);
            }
            .radio-option:has(input:checked) {
                border-color: var(--accent);
                box-shadow: 0 0 0 1px var(--accent);
            }
            .radio-option:has(input:focus-visible) {
                outline: 2px solid var(--accent-light);
                outline-offset: 2px;
            }
            .radio-option input[type="radio"] {
                flex: none;
                width: 20px;
                height: 20px;
                margin: 0;
                accent-color: var(--accent);
                cursor: pointer;
            }
            .radio-option label {
                flex: 1;
                margin: 0;
                padding: 0;
                font-size: 18px;
                line-height: 1.3;
                color: var(--accent);
                text-transform: none;
                letter-spacing: 0.01em;
                cursor: pointer;
            }

            .form-inner textarea {
                display: block;
                width: 100%;
                height: 52px;
                padding: 13px 18px;
                margin: 0;
                box-sizing: border-box;
                resize: none;
                font-size: 18px;
                line-height: 1.3;
                color: var(--accent);
                background-color: #f1eeea;
                background-image: var(--paper);
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                border: 1px solid rgba(98, 66, 49, 0.4);
                border-radius: 14px;
                letter-spacing: 0.01em;
            }
            .form-inner textarea::placeholder {
                color: rgba(98, 66, 49, 0.55);
            }
            .form-inner textarea:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 1px var(--accent);
            }

            .form-inner input[type="submit"] {
                display: block;
                width: 100%;
                height: 52px;
                margin: 4px 0 0;
                padding: 0 20px;
                font-size: 18px;
                font-weight: 500;
                letter-spacing: 0.06em;
                color: #fff;
                background: linear-gradient(160deg, var(--accent-light) 0%, var(--accent) 55%, var(--accent-dark) 100%);
                border: 1px solid var(--accent);
                border-radius: 14px;
                box-shadow: 0 8px 20px rgba(98, 66, 49, 0.3);
                cursor: pointer;
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease,
                    opacity 0.2s ease;
            }
            .form-inner input[type="submit"]:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 24px rgba(98, 66, 49, 0.4);
            }
            .form-inner input[type="submit"]:active {
                transform: scale(0.98);
            }
            .form-inner input[type="submit"]:focus-visible {
                outline: 2px solid var(--accent-light);
                outline-offset: 3px;
            }
            .form-inner input[type="submit"]:disabled {
                opacity: 0.6;
                cursor: default;
                transform: none;
            }

            .form-status {
                min-height: 26px;
                margin: 2px 0 0;
                text-align: center;
                font-size: 18px;
                color: var(--accent);
                opacity: 0;
                transform: translateY(6px);
                transition:
                    opacity 0.3s ease,
                    transform 0.3s ease;
            }
            .form-status.show {
                opacity: 1;
                transform: none;
            }
        </style>

        <style>
            .fade-in {
                opacity: 0;
                transform: translateY(20px);
                transition:
                    opacity 1s ease-out,
                    transform 1s ease-out;
            }
            .fade-in.visible {
                opacity: 1;
                transform: translateY(0);
            }
        </style>

        <style>
            /* Стили для модального окна */
            .modal {
                display: block; /* Модальное окно отображается сразу */
                position: fixed;
                z-index: 9999; /* Модальное окно поверх всех элементов */
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow-y: auto;
                background-color: rgba(0, 0, 0, 0.8); /* Затемнённый фон */
            }
            .modal-content {
                background-color: #f1eeea;
                background-image: var(--paper);
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                margin: 12vh auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
                max-width: 420px;
                text-align: center;
            }
            .modal-content img {
                display: block;
                width: 100%;
                height: auto;
            }

            /* Кнопка «Шақыртуды ашу» */
            #playMusic {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-top: 18px;
                padding: 14px 38px;
                font-family: var(--font);
                font-size: 18px;
                font-weight: 500;
                letter-spacing: 0.06em;
                color: #fff;
                background: linear-gradient(160deg, var(--accent-light) 0%, var(--accent) 55%, var(--accent-dark) 100%);
                border: 1px solid var(--accent);
                border-radius: 999px;
                box-shadow:
                    0 0 0 4px rgba(98, 66, 49, 0.25),
                    0 8px 20px rgba(98, 66, 49, 0.35);
                cursor: pointer;
                transition:
                    transform 0.25s ease,
                    box-shadow 0.25s ease;
                animation: invitePulse 2.4s ease-in-out infinite;
            }
            #playMusic::before {
                content: "♪";
                font-size: 20px;
                color: #fff;
            }
            #playMusic:hover {
                transform: translateY(-2px);
                box-shadow:
                    0 0 0 5px rgba(98, 66, 49, 0.35),
                    0 12px 26px rgba(98, 66, 49, 0.45);
            }
            #playMusic:active {
                transform: translateY(0) scale(0.97);
            }
            #playMusic:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 4px;
            }
            @keyframes invitePulse {
                0%,
                100% {
                    box-shadow:
                        0 0 0 4px rgba(98, 66, 49, 0.25),
                        0 8px 20px rgba(98, 66, 49, 0.35);
                }
                50% {
                    box-shadow:
                        0 0 0 10px rgba(98, 66, 49, 0),
                        0 8px 20px rgba(98, 66, 49, 0.35);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #playMusic {
                    animation: none;
                }
            }

            /* Отключение скроллинга страницы */
            body.modal-open {
                overflow: hidden;
            }
        </style>
    </head>
    <body class="modal-open">
        <!-- 1. Обложка -->
        <div class="fade-in" id="content">
            <img class="pic" src="photo1.png" loading="eager" alt="Сабыржан & Несибели" />
        </div>

        <!-- 2. Текст приглашения -->
        <div class="element-animation">
            <img class="pic" src="photo2.png" alt="Шақыру" />
        </div>

        <!-- 3. Календарь -->
        <img class="pic" src="photo3.png" alt="Той салтанаты: 12 қараша 2026 жылы, 18:00" />

        <!-- 4. Таймер по центру photo4 на прозрачном фоне -->
        <div class="timer-photo">
            <img class="pic" src="photo4.png" alt="Той салтанатына дейін" />
            <div class="countdown-container">
                <div class="countdown-item">
                    <span class="num" id="days"></span>
                    <span class="label">күн</span>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-item">
                    <span class="num" id="hours"></span>
                    <span class="label">сағат</span>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-item">
                    <span class="num" id="minutes"></span>
                    <span class="label">минут</span>
                </div>
                <span class="countdown-sep">:</span>
                <div class="countdown-item">
                    <span class="num" id="seconds"></span>
                    <span class="label">секунд</span>
                </div>
            </div>
        </div>

        <!-- 5. Мекен-жай (ссылка на 2GIS) -->
        <div class="element-animation">
            <a
                href="https://2gis.kz/astana/geo/70000001038051827/71.348841,51.146121?inv_by=7c536ea6c3ec4a6f8232dc961a9e7dea&inv_ts=1792784074"
            >
                <img class="pic" src="photo5.png" alt="Мекен жайымыз: Monte Bianco Hotel Astana" />
            </a>
        </div>

        <!-- 6. Подпись над формой -->
        <div class="element-animation">
            <img class="pic" src="photo7.png" alt="Тойға келетініңізді растауыңызды сұраймыз!" />
        </div>

        <!-- 7. Форма ответа -->
        <div class="form-section">
            <form class="transparent" method="post" id="form">
                <div class="form-inner">
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="question1_yes" name="name" value="Иә барамын" required />
                            <label for="question1_yes">Иә барамын</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="question1_no" name="name" value="Бара алмаймын" required />
                            <label for="question1_no">Бара алмаймын</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="question1_maybe" name="name" value="Әзірге белгісіз" required />
                            <label for="question1_maybe">Әзірге белгісіз</label>
                        </div>
                    </div>
                    <textarea
                        required
                        name="message"
                        maxlength="100"
                        id="message"
                        cols="30"
                        rows="1"
                        placeholder="Есіміңізді жазыңыз"
                    ></textarea>
                    <input type="submit" value="Жіберу" />
                    <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
                </div>
            </form>
        </div>

        <!-- 8. Той иелері -->
        <div class="element-animation">
            <img class="pic" src="photo6.png" alt="Той иелері: Ақылбай-Мадина" />
        </div>

        <!-- 9. Завершение -->
        <img class="pic" src="photo8.png" alt="Келіңіздер, қадірлі қонағы болыңыздар!" />

        <!-- Модальное окно -->
        <div id="musicModal" class="modal">
            <div class="modal-content">
                <img src="photo.jpg" alt="Сабыржан & Несибели 12.11.2026" />
                <button id="playMusic" type="button">Шақыртуды ашу</button>
            </div>
        </div>

        <audio id="backgroundMusic" loop>
            <source src="music.mp3" type="audio/mpeg" />
            Ваш браузер не поддерживает воспроизведение музыки.
        </audio>

        <script>
            // Получаем модальное окно, кнопку и аудио
            var modal = document.getElementById("musicModal");
            var playButton = document.getElementById("playMusic");
            var audio = document.getElementById("backgroundMusic");

            // При нажатии на кнопку включаем музыку и закрываем модальное окно
            playButton.onclick = function () {
                audio.play();
                closeModal();
            };

            // Функция для закрытия модального окна и разблокировки сайта
            function closeModal() {
                modal.style.display = "none"; // Скрываем модальное окно
                document.body.classList.remove("modal-open"); // Включаем прокрутку
            }
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                            observer.unobserve(entry.target);
                        }
                    });
                });

                var elements = document.querySelectorAll(".fade-in");
                elements.forEach(function (element) {
                    observer.observe(element);
                });
            });
        </script>

        <script>
            // Сюда вставьте ссылку веб-приложения Apps Script (заканчивается на /exec)
            const URL_APP =
                "https://script.google.com/macros/s/AKfycbyybJUV7n0FD2oIZIEoHOPO9KTQVbS9Hpcun_8Oj1fYLtoBoW9Cll9XBTcJK1klCNbE/exec";

            const form = document.querySelector("#form");
            const statusEl = document.querySelector("#formStatus");
            let statusTimer;

            form.action = URL_APP;

            // Мгновенный ответ гостю
            function showThanks() {
                statusEl.textContent = "Жауабыңызға рахмет!";
                statusEl.classList.add("show");
                clearTimeout(statusTimer);
                statusTimer = setTimeout(() => statusEl.classList.remove("show"), 5000);
            }

            // Отправка в таблицу в фоне (гость её не ждёт), до 3 попыток при сбое сети
            function sendInBackground(body, attempt = 1) {
                fetch(URL_APP, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
                    mode: "no-cors",
                    body: body,
                    keepalive: true, // запрос дойдёт, даже если гость закроет страницу
                }).catch(err => {
                    console.error("Error:", err);
                    if (attempt < 3) {
                        setTimeout(() => sendInBackground(body, attempt + 1), 2000 * attempt);
                    }
                });
            }

            form.addEventListener("submit", ev => {
                ev.preventDefault();

                const checked = form.querySelector("[name=name]:checked");
                const name = checked ? checked.value : "";
                const message = form.querySelector("[name=message]").value.trim();

                if (!name || !message) {
                    alert("Жауабыңызды таңдап, есіміңізді жазыңыз");
                    return;
                }

                const body = new URLSearchParams({ name, message }).toString();

                form.reset();
                showThanks();
                sendInBackground(body);
            });

            function onEntry(entry) {
                entry.forEach(change => {
                    if (change.isIntersecting) {
                        change.target.classList.add("element-show");
                    }
                });
            }
            let options = {
                threshold: [0.1],
            };
            let observer = new IntersectionObserver(onEntry, options);
            let elements = document.querySelectorAll(".element-animation");

            for (let elm of elements) {
                observer.observe(elm);
            }
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                function updateCountdown() {
                    // 12.11.2026, 18:00 по времени Астаны (UTC+5)
                    const endDate = new Date("2026-11-12T18:00:00+05:00").getTime();
                    const now = new Date().getTime();
                    const distance = endDate - now;

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    document.getElementById("days").innerText = days;
                    document.getElementById("hours").innerText = hours;
                    document.getElementById("minutes").innerText = minutes;
                    document.getElementById("seconds").innerText = seconds;

                    if (distance < 0) {
                        clearInterval(timerInterval);
                        document.getElementById("days").innerText = "00";
                        document.getElementById("hours").innerText = "00";
                        document.getElementById("minutes").innerText = "00";
                        document.getElementById("seconds").innerText = "00";
                    }
                }

                const timerInterval = setInterval(updateCountdown, 1000);
                updateCountdown();
            });
        </script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
            async
        ></script>
    </body>
</html>
